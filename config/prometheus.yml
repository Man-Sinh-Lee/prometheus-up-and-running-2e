global:
  scrape_interval: 15s
  scrape_timeout: 10s
  scrape_protocols:
  - OpenMetricsText1.0.0
  - OpenMetricsText0.0.1
  - PrometheusText0.0.4
  evaluation_interval: 15s
  external_labels:
    monitor: external
runtime:
  gogc: 75

# Alerting manager  
alerting:
  alertmanagers:
  - follow_redirects: true
    enable_http2: true
    http_headers: null
    scheme: http
    timeout: 10s
    api_version: v2
    static_configs:
    - targets:
      - 4225a859241c.mylabserver.com:9093
rule_files:
- /etc/prometheus/alert_rules.yml

# Prometheus monitoring
scrape_configs:
- job_name: prometheus
  honor_timestamps: true
  track_timestamps_staleness: false
  scrape_interval: 5s
  scrape_timeout: 5s
  scrape_protocols:
  - OpenMetricsText1.0.0
  - OpenMetricsText0.0.1
  - PrometheusText0.0.4
  metrics_path: /metrics
  scheme: https
  enable_compression: true
  basic_auth:
    username: prometheus
    password: bWFuLXNpbmgtbGVlQE1hY01pbmkK
  tls_config:
    cert_file: /etc/prometheus/fullchain.pem
    key_file: /etc/prometheus/privkey.pem
    insecure_skip_verify: true
  follow_redirects: true
  enable_http2: true
  http_headers: null
  metric_relabel_configs:
  - separator: ;
    regex: container_label_.*
    replacement: $1
    action: labeldrop
  static_configs:
  - targets:
    - 4225a859241c.mylabserver.com:9090

