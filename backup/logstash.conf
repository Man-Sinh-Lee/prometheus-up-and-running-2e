filter {
  csv {
    separator => ","
    skip_header => true
    columns => ["CaseID", "Opened", "Closed", "ResponsibleAgency", "Category", "RequestType", "Address", "Street", "SupervisorDistrict", "Neighborhood", "PoliceDistrict", "Latitude", "Longitude", "Source", "MediaURL"]
  }

  mutate {
    convert => {
      "CaseID" => "integer"
      "SupervisorDistrict" => "integer"
      "Latitude" => "float"
      "Longitude" => "float"
    }
  }

  # Update date filters to parse the specified format
  date {
    match => ["Opened", "MM/dd/yyyy hh:mm:ss a"]  # Use the correct format for parsing
    target => "Opened"
  }

  date {
    match => ["Closed", "MM/dd/yyyy hh:mm:ss a"]  # Use the correct format for parsing
    target => "Closed"
  }

  # Optionally remove any unwanted fields
  # mutate {
  #   remove_field => ["message", "log", "event", "host", "@timestamp", "@version", "tags"]
  # }
}

output {
  elasticsearch {
    hosts => ["https://4225a859241c.mylabserver.com:9200"]  # Use HTTPS
    index => "current_fiscal_year_cases"  # Specify your index name
    user => "elastic"  # Elasticsearch username
    password => "GELsUIlGH4kuRMiM7JZx"  # Elasticsearch password
    ssl_enabled => true  # Enable SSL
    cacert => "/etc/logstash/conf.d/http_ca.crt"  
    ssl_verification_mode => "full"
  }
  stdout { codec => rubydebug }  # Optional: Print output to the console for debugging
}