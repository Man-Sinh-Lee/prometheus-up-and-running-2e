# Blackbox ICMP monitorng
- job_name: blackbox_icmp
  honor_timestamps: true
  track_timestamps_staleness: false
  params:
    module:
    - icmp
  scrape_interval: 15s
  scrape_timeout: 10s
  scrape_protocols:
  - OpenMetricsText1.0.0
  - OpenMetricsText0.0.1
  - PrometheusText0.0.4
  metrics_path: /probe
  scheme: http
  enable_compression: true
  follow_redirects: true
  enable_http2: true
  http_headers: null
  relabel_configs:
  - source_labels: [__address__]
    separator: ;
    regex: (.*)
    target_label: __param_target
    replacement: $1
    action: replace
  - source_labels: [__param_target]
    separator: ;
    regex: (.*)
    target_label: instance
    replacement: $1
    action: replace
  - separator: ;
    regex: (.*)
    target_label: __address__
    replacement: 4225a859241c.mylabserver.com:9115
    action: replace
  static_configs:
  - targets:
    - 4225a859241c.mylabserver.com
    - 4225a859242c.mylabserver.com
    - 4225a859243c.mylabserver.com
    - 4225a859244c.mylabserver.com

